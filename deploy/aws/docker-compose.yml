# EC2 shape. Build from the repo root: docker compose -f deploy/aws/docker-compose.yml up -d --build
# The published port is loopback only. Put nginx in front. Do not publish 3000 on 0.0.0.0.
# Env file lives on the box (/etc/aaas.env), never in git. HOSTED=1 refuses the file store unless DATABASE_URL is set.
services:
  aaas:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: aaas:clinic
    restart: unless-stopped
    env_file:
      - /etc/aaas.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      HOSTED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - aaas-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  aaas-data:
