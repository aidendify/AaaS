<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AaaS · Clinic team</title>
<style>
:root { --bg:#f4f6f8; --card:#fff; --ink:#1b2430; --muted:#5e6b7a; --line:#e4e8ee; --blue:#0b5fff; --blue-d:#0847c7; --soft:#e8f0ff; --green:#067647; --green-bg:#e7f6ee; --amber:#8a5a00; --amber-bg:#fff6e5; --red:#b42318; --red-bg:#fdecec; --shadow:0 1px 2px rgba(16,24,40,.05); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font:15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); background:var(--bg); }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.app { display:flex; min-height:100vh; }
.side { width:248px; flex:none; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 12px 14px; position:sticky; top:0; height:100vh; }
.brand { display:flex; gap:10px; align-items:center; padding:0 8px 16px; }
.mark { width:28px; height:28px; border-radius:8px; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; }
.brand b { display:block; font-size:15px; }
.brand span { display:block; color:var(--muted); font-size:12px; font-weight:400; }
.nav { display:flex; flex-direction:column; gap:2px; }
.nav button { text-align:left; background:transparent; border:0; border-radius:8px; padding:8px 10px; color:var(--ink); display:flex; justify-content:space-between; align-items:center; }
.nav button[aria-current="page"] { background:var(--soft); color:var(--blue); font-weight:600; }
.nav button:hover { background:#f6f8fb; }
.badge { background:#eef2f6; color:var(--ink); border-radius:99px; font-size:12px; padding:0 7px; min-width:20px; text-align:center; }
.nav button[aria-current="page"] .badge { background:#d7e4ff; color:var(--blue); }
.side .grow { flex:1; }
.side select { width:100%; margin-top:4px; border:1px solid var(--line); border-radius:8px; padding:8px; background:#fff; font-size:16px; }
.role-switch { display:flex; gap:6px; padding:8px; }
.role-switch button { flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 4px; font-size:12px; }
.role-switch button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.out { margin:6px 8px 0; background:transparent; border:0; color:var(--muted); text-align:left; padding:6px; }
.main { flex:1; min-width:0; padding:28px 32px 96px; overflow-x:auto; }
.banner { background:var(--amber-bg); color:#6b4700; border:1px solid #f3e2c0; border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:13px; }
h1 { font-size:26px; letter-spacing:-.03em; margin:0 0 4px; font-weight:650; }
.sub { color:var(--muted); margin:0 0 18px; }
.callout { background:#fff; border:1px solid var(--line); border-left:3px solid var(--blue); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
.kpis, .team, .split, .days { display:grid; gap:12px; }
.kpis { grid-template-columns:repeat(auto-fit, minmax(148px, 1fr)); margin-bottom:18px; }
.team { grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); }
.card, .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
.tile { padding:14px; }
.tile .k { color:var(--muted); font-size:13px; }
.tile .v { font-size:26px; font-weight:650; letter-spacing:-.03em; margin-top:4px; }
.tile .hint { color:var(--muted); font-size:12px; margin-top:4px; }
.team button.tile { width:100%; text-align:left; }
.team button.tile:hover { border-color:#c9d7f5; }
.muted { color:var(--muted); }
.small { font-size:13px; color:var(--muted); }
h2 { font-size:16px; margin:22px 0 8px; }
table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; background:#fafbfc; }
tr:last-child td { border-bottom:0; }
.scroll { max-height:440px; overflow:auto; border-radius:12px; }
.pill { display:inline-block; border-radius:99px; padding:2px 8px; font-size:12px; background:#eef2f6; }
.pill.new, .pill.pending, .pill.draft, .pill.queued { background:#fff6e5; color:var(--amber); }
.pill.booked, .pill.scheduled, .pill.approved, .pill.completed { background:var(--green-bg); color:var(--green); }
.pill.noshow, .pill.rejected, .pill.cancelled, .pill.closed, .pill.overdue { background:var(--red-bg); color:var(--red); }
.pill.paid { background:var(--green-bg); color:var(--green); }
.pill.unpaid { background:var(--amber-bg); color:var(--amber); }
.btn, .btn-ghost, .btn-danger { border-radius:8px; padding:8px 12px; border:1px solid transparent; }
.btn { background:var(--blue); color:#fff; }
.btn:hover { background:var(--blue-d); }
.btn-ghost { background:#fff; border-color:var(--line); }
.btn-danger { background:#fff; border-color:#f0d0d0; color:var(--red); }
.btn:disabled, .btn-ghost:disabled { opacity:.5; cursor:not-allowed; }
.row-actions { display:flex; gap:6px; flex-wrap:wrap; }
.form { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin:10px 0 16px; }
.form label, .stack label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
.form input, .form select, .form textarea, .stack input, .stack select, .stack textarea { border:1px solid #d5dbe3; border-radius:8px; padding:8px 10px; background:#fff; width:100%; }
.form .wide { grid-column:span 2; }
.form .full { grid-column:1 / -1; }
.split { grid-template-columns:1fr 1fr; align-items:start; }
.days { grid-template-columns:repeat(7, minmax(0,1fr)); }
.day { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px; min-height:140px; }
.day b { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
.post { font-size:12px; background:#f6f8fb; border-radius:8px; padding:6px; margin-top:6px; }
.draft { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }
.draft p { margin:6px 0; white-space:pre-wrap; }
.rules { margin-top:16px; }
.auth { min-height:100vh; display:grid; place-items:center; padding:24px; }
.landing { min-height:100vh; display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:center; padding:32px 6vw; }
.hero h1 { font-size:40px; letter-spacing:-.04em; line-height:1.1; }
.plans { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.panel { width:min(440px, 100%); background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:var(--shadow); }
.panel h1 { font-size:28px; }
.stack { display:flex; flex-direction:column; gap:10px; }
.tabs { display:flex; gap:6px; margin-bottom:12px; }
.tabs button { flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px; }
.tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.err { color:var(--red); font-size:13px; min-height:1.2em; }
.roles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.roles button { text-align:left; padding:16px; }
.roles ul { margin:8px 0 0; padding-left:18px; color:var(--muted); }
.chat-fab { position:fixed; right:20px; bottom:20px; background:var(--ink); color:#fff; border:0; border-radius:999px; padding:12px 16px; box-shadow:0 8px 24px rgba(16,24,40,.18); z-index:5; }
.chat { position:fixed; right:20px; bottom:72px; width:min(360px, calc(100vw - 32px)); height:460px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 16px 40px rgba(16,24,40,.16); display:flex; flex-direction:column; z-index:5; }
.chat header { padding:12px 14px; border-bottom:1px solid var(--line); font-weight:650; }
.chat .log { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
.bubble { border-radius:12px; padding:8px 10px; max-width:95%; white-space:pre-wrap; }
.bubble.u { align-self:flex-end; background:var(--soft); }
.bubble.a { align-self:flex-start; background:#f6f8fb; }
.chat form { display:flex; gap:6px; padding:10px; border-top:1px solid var(--line); }
.chat input { flex:1; min-width:0; border:1px solid #d5dbe3; border-radius:8px; padding:8px 10px; font-size:16px; }
.chat form .btn { flex:none; }
.toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1b2430; color:#fff; padding:10px 14px; border-radius:10px; z-index:6; max-width:min(480px, calc(100vw - 24px)); }
.link { color:var(--blue); }
.placeholder { opacity:.85; }
.conn { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.conn .actions { display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex:none; }
.src { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
.src li { background:#f6f8fb; border-radius:999px; padding:4px 10px; font-size:13px; }
.visit-q { margin:0 0 12px; }
.terms { margin:8px 0 0; padding-left:18px; }
.scroll { overflow:auto; -webkit-overflow-scrolling:touch; }
table { min-width:520px; }
@media (max-width:1100px) {
  .days, .split, .form, .roles, .plans { grid-template-columns:1fr 1fr; }
  .side { width:220px; }
  .landing { grid-template-columns:1fr; padding:24px 16px 40px; }
  .hero h1 { font-size:32px; }
  .panel { width:min(560px, 100%); }
}
@media (max-width:800px) {
  .app { flex-direction:column; }
  .side { width:auto; height:auto; position:relative; border-right:0; border-bottom:1px solid var(--line); padding:12px 10px 8px; }
  .nav { flex-direction:row; overflow:auto; gap:4px; padding-bottom:4px; }
  .nav button { white-space:nowrap; flex:none; min-height:40px; }
  .brand span { max-width:70vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .role-switch { flex-wrap:wrap; }
  .days, .roles { grid-template-columns:1fr 1fr; }
  .split, .form, .plans, .agent-kpis { grid-template-columns:1fr !important; }
  .main { padding:16px 14px 108px; }
  .side .grow { display:none; }
  h1 { font-size:22px; }
  .hero h1 { font-size:30px; }
  .tile .v { font-size:22px; }
  .form input, .form select, .form textarea, .stack input, .stack select, .stack textarea { font-size:16px; }
  .conn { flex-direction:column; }
  .conn .actions { align-items:flex-start; flex-direction:row; flex-wrap:wrap; }
  .chat { left:8px; right:8px; width:auto; height:min(70vh, 520px); bottom:64px; }
  .chat-fab { right:12px; bottom:12px; min-height:44px; }
  .auth { padding:12px; align-items:start; }
  .landing { padding:16px 12px 32px; gap:16px; }
}
@media (max-width:480px) {
  .days, .roles, .plans { grid-template-columns:1fr; }
  .hero h1 { font-size:26px; }
  .panel { padding:18px 14px; }
  th, td { padding:8px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
function chatMd(raw) {
  const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
  let s = escHtml(raw);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  return s;
}
const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
const when = (iso) => { const t = Date.parse(iso); if (!t) return ''; return new Date(t).toLocaleString('en-IN', { timeZone:'Asia/Kolkata', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); };
const dayKey = (iso) => { const t = Date.parse(iso); if (!t) return ''; return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Kolkata', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(t)); };
const hello = () => { const h = Number(new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Kolkata', hour:'numeric', hourCycle:'h23' }).format(new Date())); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
const PILL = { new:'New', booked:'Booked', closed:'Closed', completed:'Completed', noshow:'No-show', cancelled:'Cancelled', pending:'Waiting', approved:'Approved', rejected:'Skipped', scheduled:'On calendar', draft:'Draft', queued:'Queued', paid:'Paid', unpaid:'Unpaid', overdue:'Overdue' };
const pill = (s) => `<span class="pill ${esc(s)}">${esc(PILL[s] || s || '')}</span>`;
const SCREENS = ['dash','front','recall','reviews','social','insights','billing','approvals','connections','pricing','usage','privacy','visit','settings'];

let token = sessionStorage.getItem('aaas_clinic_token') || '';
let meta = { demoLogin:false };
let state = null;
let screen = 'login';
let mode = 'signin';
let err = '';
let toast = '';
let chatOpen = false;
let chatLog = [];
let chatDraft = '';
let chatBusy = false;
let showAdd = '';
let skipProfile = false;

const root = document.getElementById('root');
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'content-type':'application/json', ...(token ? { authorization:'Bearer ' + token } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { token = ''; sessionStorage.removeItem('aaas_clinic_token'); screen = 'login'; throw new Error(d.message || 'Please sign in again.'); }
  if (!r.ok) throw new Error(d.message || 'That did not work.');
  return d;
}
function flash(m) { toast = m; setTimeout(() => { if (toast === m) { toast = ''; render(); } }, 3500); }
function go(s) { screen = s; showAdd = ''; history.replaceState(null, '', '#' + s); render(); }
function pname(id) { const p = (state.patients || []).find((x) => x.id === id); return p ? p.name : 'Unknown'; }
function wanted() { const h = location.hash.replace('#',''); return SCREENS.includes(h) ? h : 'dash'; }

function planCards() {
  const plans = meta.plans || [];
  return `<div class="plans">${plans.map((p) => `<div class="tile"><div class="k">${esc(p.name)}${p.launch?' · launch pricing':''}</div><div class="v">${inr(p.priceInr)}<span class="small"> / month</span></div><div class="hint">${esc(p.blurb)}</div></div>`).join('')}</div>`;
}
function loginView() {
  const hero = meta.hero || "A small team's work, without hiring one";
  return `<div class="landing"><section class="hero">
    <div class="brand"><div class="mark">A</div><div><b>AaaS</b><span>For the owner</span></div></div>
    <h1>${esc(hero)}</h1>
    <p class="sub">A personal AI team for a small business: daily sales, follow-up, marketing and billing. Not an enterprise suite. You approve anything that would leave the building.</p>
    ${planCards()}
    <p class="small">Nothing is charged on this page. WhatsApp is a link you open. No SMS.</p>
  </section><form class="panel stack" data-act="auth">
    <h1>${mode==='create'?'Create your account':'Sign in'}</h1>
    <p class="sub">Email and password. Then your business, then an industry. The team is created for you.</p>
    <div class="tabs"><button type="button" class="${mode==='signin'?'on':''}" data-act="mode" data-mode="signin">Sign in</button><button type="button" class="${mode==='create'?'on':''}" data-act="mode" data-mode="create">Create account</button></div>
    ${mode==='create'?'<label>Your name<input name="name" autocomplete="name" required></label>':''}
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="${mode==='create'?'new-password':'current-password'}" required minlength="8"></label>
    <div class="err">${esc(err)}</div>
    <button class="btn" type="submit">${mode==='create'?'Create account':'Sign in'}</button>
    ${meta.google?'<a class="btn-ghost" href="/api/auth/google/start?next=clinic" style="text-align:center;text-decoration:none">Continue with Google</a>':''}
    ${meta.demoLogin?'<button class="btn-ghost" type="button" data-act="demo">Explore the sample business</button><p class="small">Local or staging only. Opens a sample owner account. No password is shown.</p>':''}
  </form></div>`;
}
function profileView() {
  const p = (state && state.profile) || {};
  return `<div class="auth"><form class="panel stack" data-act="profile" style="width:min(560px,100%)">
    <div class="brand"><div class="mark">A</div><div><b>AaaS</b><span>Your business</span></div></div>
    <h1>Tell the team who you are</h1>
    <p class="sub">This stays in your account. It is the context the drafts start from. You can change it later.</p>
    <label>Business name<input name="biz" required value="${esc(state && state.biz || '')}"></label>
    <label>City<input name="city" required value="${esc(state && state.city || '')}"></label>
    <label>Services<input name="services" required value="${esc(p.services||'')}" placeholder="What you offer"></label>
    <label>Prices<input name="prices" required value="${esc(p.prices||'')}" placeholder="What you charge"></label>
    <label>Who you want to reach<input name="audience" required value="${esc(p.audience||'')}"></label>
    <label>The offer<input name="offer" required value="${esc(p.offer||'')}"></label>
    <div class="err">${esc(err)}</div>
    <button class="btn" type="submit">Continue to industry</button>
  </form></div>`;
}
function roleView() {
  const packs = (state && state.packs) || meta.packs || [];
  const card = (p) => `<button class="tile" type="button" data-act="pick" data-role="${esc(p.id)}"><b>${esc(p.title)}</b><div class="small" style="margin-top:6px">${esc(p.blurb)}</div><ul>${(p.agents||[]).map((n) => `<li>${esc(n)}</li>`).join('')}</ul></button>`;
  return `<div class="auth"><div class="panel" style="width:min(980px,100%)">
    <div class="brand"><div class="mark">A</div><div><b>AaaS</b><span>Pick an industry</span></div></div>
    <h1>Which business is this?</h1>
    <p class="sub">One click creates the team. The screens stay the same. Labels, sample rows and prompts follow the industry.</p>
    <div class="roles">${packs.map(card).join('')}</div>
    <div class="err">${esc(err)}</div>
  </div></div>`;
}
function side() {
  const pending = (state.pending || []).length;
  const item = (id, label, extra) => `<button type="button" data-act="go" data-screen="${id}" ${screen===id?'aria-current="page"':''}>${esc(label)}${extra||''}</button>`;
  return `<aside class="side">
    <div class="brand"><div class="mark">A</div><div><b>AaaS</b><span>${esc(state.biz || '')}</span></div></div>
    <nav class="nav">
      ${item('dash','Dashboard')}
      ${(state.agents||[]).map((a) => item(a.key, a.name)).join('')}
      ${item('approvals','Approvals', pending?`<span class="badge">${pending}</span>`:'')}
      ${item('connections','Connections')}
      ${item('visit','Clinic visit')}
      ${item('pricing','Pricing')}
      ${item('usage','Usage & cost')}
      ${item('settings','Settings')}
      ${item('privacy','Privacy')}
    </nav>
    <div class="grow"></div>
    <label class="small" style="padding:8px">Industry
      <select data-act="pick" aria-label="Industry">${((state.packs)||[]).map((p) => `<option value="${esc(p.id)}" ${state.role===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select>
    </label>
    <button class="out" type="button" data-act="logout">Sign out</button>
  </aside>`;
}
function kpis() {
  const s = state.stats || {};
  const L = state.labels || {};
  const tiles = [
    ['Enquiries this week', s.enquiriesWeek, s.enquiriesOpen + ' still open'],
    [L.booking || 'Bookings this week', s.bookingsWeek, 'Booked or completed'],
    ['Referral bookings', s.referralBookings, 'From a forwarded link'],
    [L.noshow || 'No-shows', s.noshows, 'This week'],
    [L.recall || 'Recalls due', s.recallsDue, 'No ' + (L.visit || 'visit') + ' in 6 months'],
    ['Reviews requested', s.reviews, 'Drafts on file'],
    ['Posts scheduled', s.posts, 'On the calendar, not published'],
    [L.revenue || 'Paid this month', inr(s.revenue), 'Invoices marked paid'],
    [(L.who || 'Patients') + ' last 2 months', s.patientsLast2Months, s.patientsTotal + ' on file'],
  ];
  return `<div class="kpis">${tiles.map(([k,v,h]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="hint">${esc(h)}</div></div>`).join('')}</div>`;
}
function banner() {
  if (!state.demo && !state.sample) return '';
  return `<div class="banner">Sample rows for ${esc(state.biz)}, ${esc(state.city)} are fake and marked DEMO. This screen is for the owner, not a login for ${esc((state.labels&&state.labels.who)||'customers')}. AaaS does not email, text, post, or collect a payment.</div>`;
}
function checklistCard() {
  const steps = state.checklist || [];
  if (!steps.length || steps.every((s) => s.done)) return '';
  const go = { import: 'connections', form: 'connections', approve: 'approvals' };
  return `<div class="callout"><b>First run</b><p class="small">Three steps, then the team is working from your records.</p><ol>${steps.map((s) => `<li>${s.done?'Done: ':''}<button type="button" class="btn-ghost" data-act="go" data-screen="${go[s.id]||'dash'}">${esc(s.title)}</button> <span class="small">${esc(s.detail)}</span></li>`).join('')}</ol></div>`;
}
function dash() {
  const L = state.labels || {};
  return `${banner()}<h1>${hello()}. Here is your week.</h1><p class="sub">${esc(state.biz)} · ${esc(state.city)}</p>
    <div class="callout"><b>${esc(state.hero || '')}</b><div>${esc(state.pitch || '')}</div></div>
    ${checklistCard()}
    ${softwareCard()}
    ${forecastCard()}
    ${kpis()}
    <h2>Your team</h2>

  return `${banner()}<h1>Connections</h1><p class="sub">Eka.care reads from their API when the server has credentials. A sample ${esc(place)} stays on sample rows and shows Connected (demo). Other software can use CSV or a webhook. Nothing is sent back out.</p>
    ${(state.connections||[]).map((c) => `<div class="draft conn"><div><b>${esc(c.name)}</b><div class="small">${esc(c.detail)}</div>${c.url?`<div class="small"><a class="link" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></div>`:''}${c.docs?`<div class="small"><a class="link" href="${esc(c.docs)}" target="_blank" rel="noopener">API docs</a></div>`:''}</div><div class="actions">${connState(c)}${c.id==='eka' && (c.status==='demo' || c.status==='ready')?'<button class="btn" type="button" data-act="sync-eka">Sync</button>':''}</div></div>`).join('')}
    <p><button class="btn" type="button" data-act="form-done">I have put the booking form on my site</button></p>
    <h2>Import a CSV</h2>
    <p class="small">Columns: type, name, phone, email, last_visit, value, when, service, status, fee. The file uses type patient for a person and appointment for a ${esc((state.labels&&state.labels.visit)||'visit')}. Up to 2000 rows. Nothing is sent.</p>
    <form class="form" data-act="csv"><label class="full">CSV file<input name="file" type="file" accept=".csv,text/csv"></label><div><button class="btn" type="submit">Import</button></div></form>
    <pre class="small" style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto">type,name,phone,email,last_visit,value,when,service,status,fee
patient,Demo Import,919000000099,import@example.com,2026-10-01,1800,,,,
appointment,Demo Import,919000000099,,,,2026-10-28T05:30:00.000Z,${esc((state.labels&&state.labels.service)||'Visit')},booked,900</pre>`;
}
function chat() {
  if (!state || !state.role) return '';
  const who = (state.labels && state.labels.who) || 'patients';
  return `<button class="chat-fab" type="button" data-act="chat-toggle">${chatOpen?'Close chat':'Chat'}</button>
    ${chatOpen?`<section class="chat" aria-label="Ask your team"><header>Ask your team</header><div class="log">${chatLog.map((m) => `<div class="bubble ${m.r}">${m.r==='a'?chatMd(m.t):esc(m.t)}</div>`).join('') || `<div class="small">Try “How many ${esc(who)} in the last 2 months?”</div>`}${chatBusy?'<div class="small">Checking the records…</div>':''}</div>
      <form data-act="chat"><input id="chatIn" name="message" value="${esc(chatDraft)}" placeholder="How many ${esc(who)} in the last 2 months?" autocomplete="off"><button class="btn" type="submit">Send</button></form></section>`:''}`;
}
function render() {
  let body = '';
  if (!token) body = loginView();
  else if (!state) body = roleView();
  else if (!state.role) body = screen === 'role' ? roleView() : profileView();
  else {
    const page = { dash, front, recall, reviews, social, insights, billing, approvals, connections, pricing, usage, privacy, visit, settings }[screen] || dash;
    body = `<div class="app">${side()}<main class="main" data-screen="${esc(screen)}">${page()}</main></div>${chat()}`;
  }
  if (toast) body += `<div class="toast" role="status">${esc(toast)}</div>`;
  root.innerHTML = body;
  const input = document.getElementById('chatIn');
  if (input && chatOpen) input.focus();
}
async function reload() {
  state = await api('/api/clinic');
  if (!state.role) screen = skipProfile ? 'role' : ((state.profile && state.profile.services) ? 'role' : 'profile');
  render();
}
async function act(name, el) {
  try {
    if (name === 'mode') { mode = el.dataset.mode; err = ''; render(); return; }
    if (name === 'go') { go(el.dataset.screen); return; }
    if (name === 'chat-toggle') { chatOpen = !chatOpen; render(); return; }
    if (name === 'logout') { token = ''; sessionStorage.removeItem('aaas_clinic_token'); state = null; screen = 'login'; skipProfile = false; render(); return; }
    if (name === 'auth') {
      const f = Object.fromEntries(new FormData(el).entries());
      const path = mode === 'create' ? '/api/auth/signup' : '/api/auth/login';
      const d = await api(path, { email:f.email, password:f.password, name:f.name || 'Clinic owner' });
      token = d.token; sessionStorage.setItem('aaas_clinic_token', token); err = ''; skipProfile = false;
      await reload(); return;
    }
    if (name === 'demo') {
      const d = await api('/api/clinic/demo', {});
      token = d.token; sessionStorage.setItem('aaas_clinic_token', token);
      skipProfile = true; await reload(); return;
    }
    if (name === 'profile') {
      const f = Object.fromEntries(new FormData(el).entries());
      state = { ...(state||{}), ...(await api('/api/clinic/profile', f)), packs: (state&&state.packs)||meta.packs, plans: (state&&state.plans)||meta.plans };
      if (!state.packs) state.packs = meta.packs;
      screen = 'role'; render(); return;
    }
    if (name === 'pick') {
      const role = el.dataset.role || el.value;
      if (!role || role === (state && state.role)) return;
      state = await api('/api/clinic/role', { role });
      if (screen === 'role' || screen === 'login' || screen === 'profile') screen = wanted();
      flash((state.roleTitle || 'Team') + ' is ready.');
      render(); return;
    }
    if (name === 'add-enq') { const f = Object.fromEntries(new FormData(el).entries()); await api('/api/clinic/enquiries', f); flash('Enquiry added.'); }
    else if (name === 'enq-status') await api('/api/clinic/enquiries/update', { id:Number(el.dataset.id), status:el.dataset.status });
    else if (name === 'enq-del') { if (!confirm('Delete this enquiry?')) return; await api('/api/clinic/enquiries/delete', { id:Number(el.dataset.id) }); }
    else if (name === 'add-appt') { const f = Object.fromEntries(new FormData(el).entries()); if (f.at) f.at = new Date(f.at).toISOString(); f.patientId = Number(f.patientId); f.fee = Number(f.fee||0); await api('/api/clinic/appointments', f); flash('Appointment added.'); }
    else if (name === 'appt-status') await api('/api/clinic/appointments/update', { id:Number(el.dataset.id), status:el.dataset.status });
    else if (name === 'appt-del') { if (!confirm('Delete this appointment?')) return; await api('/api/clinic/appointments/delete', { id:Number(el.dataset.id) }); }
    else if (name === 'remind') { await api('/api/clinic/reminders', { appointmentId:Number(el.dataset.id) }); flash('Reminder queued for approval. Nothing was sent.'); }
    else if (name === 'recall') { await api('/api/clinic/recall/draft', { patientId:Number(el.dataset.id) }); flash('Follow-up drafted. It is waiting in Approvals.'); }
    else if (name === 'review') { await api('/api/clinic/reviews/draft', { patientId:Number(el.dataset.id) }); flash('Review request drafted with a WhatsApp link.'); }
    else if (name === 'social') { const f = Object.fromEntries(new FormData(el).entries()); if (f.when) f.when = new Date(f.when + 'T09:00:00+05:30').toISOString(); await api('/api/clinic/social/draft', f); flash('Post drafted. It waits for approval.'); }
    else if (name === 'referral') { const f = Object.fromEntries(new FormData(el).entries()); await api('/api/clinic/referrals/draft', { patientId: Number(f.patientId) }); flash('Referral message drafted. It waits in Approvals. Nothing was sent.'); }
    else if (name === 'refresh') { await api('/api/clinic/insights/refresh', {}); flash('Summary refreshed from the records.'); }
    else if (name === 'rules') {
      const f = Object.fromEntries(new FormData(el).entries());
      if (f.everyDays) f.everyDays = Number(f.everyDays);
      if (f.cap) f.cap = Number(f.cap);
      await api('/api/clinic/rules', f); flash('Reminder settings saved. Nothing is sent.');
    }
    else if (name === 'tone-reset') { await api('/api/clinic/tone/reset', {}); flash('Learned tone cleared. Later drafts use the standard wording.'); }
    else if (name === 'pause') { const a = state.agents.find((x) => x.key===el.dataset.key); await api('/api/clinic/agent', { key:el.dataset.key, paused:!a.paused }); }
    else if (name === 'edit-draft') { const f = Object.fromEntries(new FormData(el).entries()); await api('/api/clinic/drafts/edit', { id:Number(f.id), body:f.body }); flash('Draft updated.'); }
    else if (name === 'decide') { await api('/api/clinic/decide', { id:el.dataset.id, decision:el.dataset.decision }); flash(el.dataset.decision==='approve' ? 'Approved. Nothing was sent.' : 'Rejected. Nothing was sent.'); }
    else if (name === 'form-done') { await api('/api/clinic/checklist', { id: 'form' }); flash('Booking form marked as connected.'); }
    else if (name === 'sync-eka') {
      const r = await api('/api/clinic/connectors/sync', { provider: 'eka' });
      flash(r.mode === 'demo' ? 'Connected (demo). Sample rows only. Eka.care was not called.' : 'Synced from Eka.care. Nothing was sent back.');
    }
    else if (name === 'visit') {
      const f = Object.fromEntries(new FormData(el).entries());
      const answers = {};
      for (const q of ((state.visit && state.visit.questions) || [])) answers[q.id] = f[q.id] || '';
      await api('/api/clinic/visit', { who: f.who || '', notes: f.notes || '', accept: f.accept === 'yes', answers });
      flash('Visit notes saved in this account.');
    }
    else if (name === 'add-inv') {
      const f = Object.fromEntries(new FormData(el).entries());
      await api('/api/clinic/invoices', { patientId: Number(f.patientId), items: [{ desc: f.desc, qty: Number(f.qty||1), rate: Number(f.rate||0) }], gst: f.gst, due: f.due ? new Date(f.due + 'T18:00:00+05:30').toISOString() : '', upi: f.upi, payLink: f.payLink });
      flash('Invoice saved. Nothing was collected.');
    }
    else if (name === 'paid') { await api('/api/clinic/invoices/update', { id: Number(el.dataset.id), status: el.dataset.status }); flash(el.dataset.status==='paid' ? 'Marked paid. The dashboard uses paid invoices.' : 'Marked unpaid.'); }
    else if (name === 'remind-inv') { await api('/api/clinic/invoices/remind', { id: Number(el.dataset.id) }); flash('Payment reminder queued. Nothing was sent.'); }
    else if (name === 'print' || name === 'pdf') {
      const r = await fetch('/api/clinic/invoices/' + el.dataset.id + (name==='pdf'?'/pdf':'/print'), { headers: { authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error('That invoice did not open.');
      const blob = await r.blob(); const url = URL.createObjectURL(blob);
      if (name === 'print') window.open(url, '_blank', 'noopener');
      else { const a = document.createElement('a'); a.href = url; a.download = (el.dataset.number || 'invoice') + '.pdf'; a.click(); }
      return;
    }
    else if (name === 'export') {
      const r = await fetch('/api/clinic/export', { headers: { authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error('Export did not download.');
      const blob = await r.blob(); const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'aaas-clinic-export.json'; a.click();
      return;
    }
    else if (name === 'wipe') {
      const confirm = new FormData(el).get('confirm');
      await api('/api/clinic/data/delete', { confirm });
      flash('Records deleted. Your sign-in is still here.');
      skipProfile = false; await reload(); return;
    }
    else if (name === 'wipe-account') {
      const password = new FormData(el).get('password');
      await api('/api/auth/delete', { password });
      token = ''; sessionStorage.removeItem('aaas_clinic_token'); state = null; screen = 'login';
      flash('Account deleted.'); render(); return;
    }
    else if (name === 'csv') {
      const file = el.querySelector('input[type=file]').files[0]; if (!file) throw new Error('Choose a CSV file.');
      const csv = await file.text(); const r = await api('/api/clinic/import', { csv });
      const who = (state.labels && state.labels.who) || 'people';
      const visitWord = (state.labels && state.labels.visit) || 'visit';
      const visits = /class$/.test(visitWord) ? visitWord + 'es' : visitWord + 's';
      flash(`Imported ${r.patients} ${who} and ${r.appointments} ${visits}.` + (r.errors.length?` ${r.errors.length} rows skipped.` : ''));
    }
    else if (name === 'chat') {
      const message = (new FormData(el).get('message') || '').trim();
      if (!message) return;
      chatDraft = ''; chatLog.push({ r:'u', t:message }); chatBusy = true; render();
      const hist = chatLog.slice(0, -1).slice(-6);
      const d = await api('/api/clinic/chat', { message, history: hist });
      chatLog.push({ r:'a', t:d.answer }); chatBusy = false; await reload(); return;
    }
    if (token) await reload();
  } catch (e) { err = e.message; toast = e.message; chatBusy = false; render(); }
}
root.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b || b.closest('form[data-act]') && b.type === 'submit') return; if (b.dataset.act === 'mode' || b.type === 'button' || b.classList.contains('tile') || b.classList.contains('chat-fab') || b.classList.contains('out')) { e.preventDefault(); act(b.dataset.act, b); } });
root.addEventListener('change', (e) => { if (e.target && e.target.dataset && e.target.dataset.act === 'pick') act('pick', e.target); });
root.addEventListener('submit', (e) => { const f = e.target.closest('form[data-act]'); if (!f) return; e.preventDefault(); act(f.dataset.act, f); });
root.addEventListener('input', (e) => { if (e.target.id === 'chatIn') chatDraft = e.target.value; });
(async () => {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('as_auth')) { token = hash.get('as_auth'); sessionStorage.setItem('aaas_clinic_token', token); history.replaceState(null, '', '/clinic'); }
  try { meta = await (await fetch('/api/clinic/meta')).json(); } catch { /* offline */ }
  if (token) { try { await reload(); if (state && state.role) { screen = wanted(); render(); } } catch { token = ''; screen = 'login'; render(); } }
  else render();
})();
</script>
</body>
</html>
