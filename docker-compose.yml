# docker compose up -d   then open http://localhost:3000
services:
  aidentify:
    build: .
    image: aidentify:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - aidentify-data:/app/data
volumes:
  aidentify-data:
