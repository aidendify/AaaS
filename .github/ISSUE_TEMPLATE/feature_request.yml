name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve?, description: Who is it for (agency, small business, developer)? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Your idea }
    validations: { required: true }
  - type: textarea
    id: alt
    attributes: { label: Alternatives you considered }
  - type: checkboxes
    id: help
    attributes: { label: Contribution, options: [{ label: I would like to build this myself }] }
